{% set name = "tree-sitter-typescript" %}
{% set pypi_name = "tree_sitter_typescript" %}
{% set version = "0.23.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ pypi_name }}/{{ pypi_name }}-{{ version }}.tar.gz
  sha256: 7b167b5827c882261cb7a50dfa0fb567975f9b315e87ed87ad0a0a3aedb3834d

build:
  number: 0
  # upstream requires-python >=3.9
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=42
    - wheel
  run:
    - python
  run_constrained:
    # upstream [project.optional-dependencies] 'core' extra: tree-sitter~=0.23
    # the core binding publishes as conda name tree_sitter (underscore) per its
    # packaging convention; inert until that package exists on pkgs/main
    - tree_sitter >=0.23,<1.0

test:
  requires:
    - pip
  imports:
    - tree_sitter_typescript
  commands:
    - pip check
    # grammar sanity without the 'tree_sitter' binding package (not on pkgs/main):
    # unwrap each language capsule and read the TSLanguage struct's first int32,
    # which is the grammar ABI version (LANGUAGE_VERSION in src/parser.c);
    # the sdist ships BOTH the typescript and tsx grammars
    - python -c "import ctypes; import tree_sitter_typescript; ctypes.pythonapi.PyCapsule_GetPointer.restype = ctypes.c_void_p; ctypes.pythonapi.PyCapsule_GetPointer.argtypes = [ctypes.py_object, ctypes.c_char_p]; get = ctypes.pythonapi.PyCapsule_GetPointer; ts_ptr = get(tree_sitter_typescript.language_typescript(), b'tree_sitter.Language'); tsx_ptr = get(tree_sitter_typescript.language_tsx(), b'tree_sitter.Language'); ts_abi = ctypes.c_int32.from_address(ts_ptr).value; tsx_abi = ctypes.c_int32.from_address(tsx_ptr).value; assert ts_abi == 14, ts_abi; assert tsx_abi == 14, tsx_abi"

about:
  home: https://github.com/tree-sitter/tree-sitter-typescript
  summary: TypeScript and TSX grammars for tree-sitter
  description: >-
    TypeScript and TSX grammars for tree-sitter, providing parsers for both
    languages built with the tree-sitter incremental parsing toolkit.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://github.com/tree-sitter/tree-sitter-typescript#readme
  dev_url: https://github.com/tree-sitter/tree-sitter-typescript

extra:
  recipe-maintainers:
    - killua156
    - mgorny
    - rxm7706
