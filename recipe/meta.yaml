{% set name = "tree-sitter-typescript" %}
{% set pypi_name = "tree_sitter_typescript" %}
{% set version = "0.23.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # GitHub tag tarball, not the PyPI sdist: the sdist strips the vendored
  # tree_sitter/parser.h headers both grammars need to compile.
  url: https://github.com/tree-sitter/tree-sitter-typescript/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 2c4ce711ae8d1218a3b2f899189298159d672870b5b34dff5d937bed2f3e8983

build:
  number: 0
  # upstream requires-python >=3.9
  skip: true  # [py<39]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
  host:
    - python
    - pip
    - setuptools >=42
    - wheel
  run:
    - python
  run_constrained:
    # upstream [project.optional-dependencies] 'core' extra: tree-sitter~=0.23
    # the core binding publishes as conda name tree_sitter (underscore) per its
    # packaging convention; inert until that package exists on pkgs/main
    - tree_sitter >=0.23,<1.0

test:
  requires:
    - pip
    - tree_sitter
  imports:
    - tree_sitter_typescript
  commands:
    - pip check
    # parse with the core binding (tree_sitter) to prove both shipped grammars
    # load and produce the expected root node; abi_version cross-checks each
    # grammar's LANGUAGE_VERSION with the runtime
    - python -c "import tree_sitter, tree_sitter_typescript; ts = tree_sitter.Language(tree_sitter_typescript.language_typescript()); tsx = tree_sitter.Language(tree_sitter_typescript.language_tsx()); assert ts.abi_version == 14 and tsx.abi_version == 14; assert tree_sitter.Parser(ts).parse(b'const x = 1;').root_node.type == 'program'; assert tree_sitter.Parser(tsx).parse(b'const el = <div />;').root_node.type == 'program'"

about:
  home: https://github.com/tree-sitter/tree-sitter-typescript
  summary: TypeScript and TSX grammars for tree-sitter
  description: >-
    TypeScript and TSX grammars for tree-sitter, providing parsers for both
    languages built with the tree-sitter incremental parsing toolkit.
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://github.com/tree-sitter/tree-sitter-typescript#readme
  dev_url: https://github.com/tree-sitter/tree-sitter-typescript

extra:
  recipe-maintainers:
    - killua156
    - mgorny
    - rxm7706
